<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — liberação de professores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="admin-gate">
    <form id="code-form" class="card">
      <h1>Acesso do administrador</h1>
      <span class="password-field">
        <input id="access-code" type="password" placeholder="Código de acesso" required />
        <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
      </span>
      <p id="code-error"></p>
      <button type="submit" class="btn-primary btn-primary--form">Entrar</button>
    </form>
  </div>

  <div id="admin-panel" hidden>
    <h1>Professores aguardando liberação</h1>
    <ul id="pending-list"></ul>

    <h1>Professores liberados</h1>
    <ul id="approved-list"></ul>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
