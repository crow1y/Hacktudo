<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — liberação de professores</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    /* :not([hidden]) porque display:flex teria mais especificidade que a
       regra padrão do navegador pra [hidden], reexibindo o bloco escondido. */
    #admin-gate:not([hidden]) {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #admin-gate form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 320px;
      background: #fff;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    #admin-gate input {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 1rem;
      width: 100%;
    }
    .password-field {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .password-field input {
      flex: 1;
      min-width: 0;
    }
    .toggle-senha {
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.4rem;
    }
    #admin-gate button {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #code-error {
      color: #c0392b;
      font-size: 0.85rem;
      margin: 0;
      min-height: 1.1em;
    }
    #admin-panel {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    #admin-panel ul {
      list-style: none;
      padding: 0;
    }
    #admin-panel li {
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    #admin-panel button {
      border: none;
      border-radius: 999px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    button[data-acao="liberar"] { background: #1a9c4a; color: #fff; }
    button[data-acao="revogar"] { background: #eee; color: #333; }
  </style>
</head>
<body>
  <div id="admin-gate">
    <form id="code-form">
      <h1>Acesso do administrador</h1>
      <span class="password-field">
        <input id="access-code" type="password" placeholder="Código de acesso" required />
        <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
      </span>
      <p id="code-error"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <div id="admin-panel" hidden>
    <h1>Professores aguardando liberação</h1>
    <ul id="pending-list"></ul>

    <h1>Professores liberados</h1>
    <ul id="approved-list"></ul>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
