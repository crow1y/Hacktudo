<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor de RA — Aluno</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- TEMPORÁRIO: console de debug visível no celular (sem cabo/PC), pra
       diagnosticar o travamento no carregamento da câmera. Remover depois
       de resolvido — botão flutuante no canto da tela abre o painel. -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Usado só pelo modo WebXR (aluno/js/webxr-mode.js), carregado sob
       demanda (import dinâmico) — não é o mesmo build de Three.js que o
       A-Frame usa internamente (aquele é um fork/vendored), por isso uma
       instância própria em vez de reaproveitar AFRAME.THREE. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="auth-gate">
    <form id="login-form">
      <h1>Área do aluno</h1>
      <label>Matrícula <input name="matricula" required autocomplete="username" /></label>
      <label>Senha <input name="senha" type="password" required autocomplete="current-password" /></label>
      <p id="login-error" class="auth-error"></p>
      <button type="submit">Entrar</button>
      <button type="button" id="to-signup" class="auth-link">Criar conta</button>
    </form>

    <form id="signup-form" hidden>
      <h1>Criar conta de aluno</h1>
      <label>Nome completo <input name="nome" required autocomplete="name" /></label>
      <label>Matrícula <input name="matricula" required autocomplete="username" /></label>
      <label>Senha <input name="senha" type="password" required autocomplete="new-password" /></label>
      <label>Confirmar senha <input name="confirmarSenha" type="password" required autocomplete="new-password" /></label>
      <p class="password-rules">
        Mínimo 8 caracteres, com letra maiúscula, minúscula, número e
        caractere especial.
      </p>
      <p id="signup-error" class="auth-error"></p>
      <button type="submit">Criar conta</button>
      <button type="button" id="to-login" class="auth-link">Já tenho conta</button>
    </form>
  </div>

  <div id="app-content" hidden>
    <!-- A cena do MindAR/A-Frame é injetada aqui dinamicamente por js/ar.js,
         a partir do target/model definidos em content/animals.json. -->
    <div id="ar-container"></div>
    <div id="ar-error" hidden></div>
    <button id="place-floor-btn" hidden>📍 Fixar no chão (tamanho real)</button>
    <!-- Cena do modo WebXR (aluno/js/webxr-mode.js) — Three.js puro, some
         da tela quando não está em uso. -->
    <div id="webxr-container" hidden></div>

    <!-- Camada de "uso consciente": timer de modo aula, pausa e check-in de humor -->
    <div id="wellbeing-layer">
      <div id="modo-aula-timer" hidden></div>
      <div id="pausa-lembrete" hidden></div>
      <div id="mood-checkin" hidden></div>
    </div>

    <button type="button" id="logout-btn" class="logout-btn">Sair</button>
  </div>

  <script type="module" src="js/auth-gate.js"></script>
</body>
</html>
