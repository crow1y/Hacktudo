<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor de RA — Aluno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- TEMPORÁRIO: console de debug visível no celular (sem cabo/PC), pra
       diagnosticar o travamento no carregamento da câmera. Remover depois
       de resolvido — botão flutuante no canto da tela abre o painel. -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Cartão de prévia (aluno/js/ar.js): visualizador 3D independente do
       MindAR/A-Frame — tentativas de prender o modelo na câmera dentro
       da cena do MindAR não renderizavam em dispositivo real por um
       motivo não identificado, então essa parte usa um motor separado. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

  <!-- Usado só pelo modo WebXR (aluno/js/webxr-mode.js), carregado sob
       demanda (import dinâmico) — não é o mesmo build de Three.js que o
       A-Frame usa internamente (aquele é um fork/vendored), por isso uma
       instância própria em vez de reaproveitar AFRAME.THREE. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="auth-gate">
    <form id="login-form" class="card">
      <h1>Área do aluno</h1>
      <label class="field">Matrícula <input name="matricula" required autocomplete="username" /></label>
      <label class="field">Senha
        <span class="password-field">
          <input name="senha" type="password" required autocomplete="current-password" />
          <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
        </span>
      </label>
      <p id="login-error" class="auth-error"></p>
      <button type="submit" class="btn-primary btn-primary--form">Entrar</button>
      <button type="button" id="to-signup" class="btn-link">Criar conta</button>
    </form>

    <form id="signup-form" class="card" hidden>
      <h1>Criar conta de aluno</h1>
      <label class="field">Nome completo <input name="nome" required autocomplete="name" /></label>
      <label class="field">Matrícula <input name="matricula" required autocomplete="username" /></label>
      <label class="field">Senha
        <span class="password-field">
          <input name="senha" type="password" required autocomplete="new-password" />
          <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
        </span>
      </label>
      <label class="field">Confirmar senha
        <span class="password-field">
          <input name="confirmarSenha" type="password" required autocomplete="new-password" />
          <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
        </span>
      </label>
      <p class="password-rules">
        Mínimo 8 caracteres, com letra maiúscula, minúscula, número e
        caractere especial.
      </p>
      <p id="signup-error" class="auth-error"></p>
      <button type="submit" class="btn-primary btn-primary--form">Criar conta</button>
      <button type="button" id="to-login" class="btn-link">Já tenho conta</button>
    </form>
  </div>

  <div id="app-content" hidden>
    <!-- A cena do MindAR/A-Frame é injetada aqui dinamicamente por js/ar.js,
         a partir do target/model definidos em content/animals.json. -->
    <div id="ar-container"></div>
    <div id="ar-error" hidden></div>
    <!-- Escurece as bordas quando um animal é reconhecido, deixando o
         cartão de prévia (centro da tela) em destaque. -->
    <div id="ar-vignette" hidden></div>
    <!-- Cartão de prévia: <model-viewer> é um motor 3D próprio, isolado
         do MindAR/A-Frame — ver comentário no <head>. -->
    <div id="preview-card" hidden>
      <model-viewer id="preview-model-viewer" auto-rotate camera-controls disable-zoom autoplay></model-viewer>
      <div id="preview-name"></div>
    </div>
    <button id="place-floor-btn" hidden>📍 Fixar no chão (tamanho real)</button>
    <button id="scan-another-btn" hidden>🔄 Escanear outro</button>
    <!-- Cena do modo WebXR (aluno/js/webxr-mode.js) — Three.js puro, some
         da tela quando não está em uso. -->
    <div id="webxr-container" hidden></div>

    <!-- Check-in de presença: toast discreto pro check automático, card
         modal pro pedido de confirmação a cada CHECKIN_INTERVAL_MS. -->
    <div id="checkin-toast" hidden></div>
    <div id="checkin-aviso" hidden></div>

    <button type="button" id="logout-btn" class="logout-btn">Sair</button>
  </div>

  <script type="module" src="js/auth-gate.js"></script>
</body>
</html>
